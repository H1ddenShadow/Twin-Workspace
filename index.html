<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Workspace - Notion-like Local-First PWA with Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        notion: {
                            light: '#ffffff',
                            dark: '#191919',
                            sidebarLight: '#f7f6f3',
                            sidebarDark: '#202020',
                            hoverLight: '#efefe0',
                            hoverDark: '#2c2c2c',
                            borderLight: '#e9e9e7',
                            borderDark: '#2f2f2f',
                            accent: '#2eaadc'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JSZip for Notion ZIP and backup imports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #a1a1aa;
            cursor: text;
        }
        .dark [contenteditable]:empty:before { color: #52525b; }
        .hidden-input { display: none; }
    </style>
    <!-- SortableJS for Kanban Drag & Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body class="h-full bg-notion-light dark:bg-notion-dark text-slate-800 dark:text-slate-100 font-sans antialiased overflow-hidden flex flex-col">

    <!-- Top App Banner / Offline & Auth Bar -->
    <header class="h-10 bg-slate-100 dark:bg-zinc-900 border-b border-slate-200 dark:border-zinc-800 flex items-center justify-between px-3 text-xs shrink-0 select-none z-20">
        <div class="flex items-center space-x-3">
            <span class="font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                <i data-lucide="layers" class="w-4 h-4 text-sky-500"></i> Workspace PWA
            </span>
            <span id="network-badge" class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online
            </span>
            <span id="sync-spinner-badge" class="hidden px-2 py-0.5 rounded-full text-[10px] font-medium bg-blue-100 text-blue-800 flex items-center gap-1">
                <i data-lucide="refresh-cw" class="w-3 h-3 animate-spin"></i> Syncing...
            </span>
        </div>

        <div class="flex items-center space-x-2">
            <span id="user-email-display" class="text-slate-500 dark:text-slate-400 font-medium truncate max-w-[150px]"></span>
            <button id="auth-toggle-btn" class="bg-sky-600 hover:bg-sky-500 text-white px-2.5 py-1 rounded text-xs font-medium transition">Sign In</button>
            <button id="theme-toggle" class="p-1 hover:bg-slate-200 dark:hover:bg-zinc-800 rounded text-slate-600 dark:text-slate-400 transition" title="Toggle Theme">
                <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-notion-sidebarLight dark:bg-notion-sidebarDark border-r border-notion-borderLight dark:border-notion-borderDark flex flex-col shrink-0 select-none transition-all duration-200 z-10">
            <div class="p-3 border-b border-slate-200/60 dark:border-zinc-800/80 flex items-center justify-between">
                <div class="flex items-center space-x-2 truncate">
                    <div class="w-6 h-6 rounded bg-gradient-to-tr from-sky-500 to-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">N</div>
                    <span class="font-semibold text-sm truncate">Twin Workspace</span>
                </div>
                <button id="sidebar-toggle" class="p-1 hover:bg-slate-200 dark:hover:bg-zinc-700 rounded text-slate-500" title="Close Sidebar">
                    <i data-lucide="panel-left-close" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="p-2 space-y-1">
                <button id="btn-quick-new-page" class="w-full flex items-center space-x-2 px-2 py-1.5 text-xs rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-zinc-700/60 transition">
                    <i data-lucide="plus-circle" class="w-4 h-4 text-sky-500"></i>
                    <span class="font-medium">New Page</span>
                </button>
                <button id="btn-quick-new-folder" class="w-full flex items-center space-x-2 px-2 py-1.5 text-xs rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-zinc-700/60 transition">
                    <i data-lucide="folder-plus" class="w-4 h-4 text-amber-500"></i>
                    <span class="font-medium">New Folder</span>
                </button>
                


                <div class="relative mt-2">
                    <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-slate-400"></i>
                    <input type="text" id="sidebar-search" name="search" placeholder="Quick filter..." class="w-full pl-8 pr-3 py-1.5 bg-slate-200/60 dark:bg-zinc-800/80 border-0 rounded-md text-xs focus:ring-1 focus:ring-sky-500 outline-none">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-2 py-2 space-y-0.5" id="tree-root"></div>

                        <!-- Side-by-side Export & Import Buttons -->
            <div class="p-2 border-t border-slate-200/60 dark:border-zinc-800/80 flex gap-1.5">
                <button id="btn-export-workspace" class="flex-1 flex items-center justify-center space-x-1 px-2 py-1.5 text-xs rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-zinc-700/60 transition" title="Export Workspace JSON">
                    <i data-lucide="upload" class="w-4 h-4 text-sky-500"></i>
                    <span class="font-medium">Export</span>
                </button>
                <button id="btn-import-file" class="flex-1 flex items-center justify-center space-x-1 px-2 py-1.5 text-xs rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-zinc-700/60 transition" title="Import File (JSON / ZIP / CSV)">
                    <i data-lucide="download" class="w-4 h-4 text-emerald-500"></i>
                    <span class="font-medium">Import</span>
                </button>
                <input type="file" id="universal-file-input" class="hidden-input" accept=".json, .zip, .csv">
            </div>
            <div class="p-3 text-[11px] text-slate-400 border-t border-slate-200/60 dark:border-zinc-800/80 flex justify-between items-center">
                <span>Local + Supabase Sync</span>
                <span class="text-sky-500 font-semibold" id="item-count">0 items</span>
            </div>
        </aside>

        <!-- Sidebar Re-open Floating Button (When collapsed) -->
        <button id="sidebar-open-btn" class="hidden absolute top-3 left-3 z-30 p-1.5 bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-md shadow-md text-slate-600 dark:text-slate-300 hover:bg-slate-100" title="Open Sidebar">
            <i data-lucide="panel-left-open" class="w-4 h-4"></i>
        </button>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 bg-white dark:bg-notion-dark overflow-hidden">
            <div class="h-11 border-b border-slate-200 dark:border-zinc-800 flex items-center justify-between px-4 text-xs select-none">
                <div class="flex items-center space-x-2 text-slate-500 dark:text-slate-400 overflow-hidden" id="breadcrumbs">
                    <span>Workspace</span>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5 shrink-0"></i>
                    <span class="font-medium text-slate-800 dark:text-slate-200 truncate" id="current-title-breadcrumb">Select a page</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="delete-current-page" class="p-1.5 hover:bg-red-100 dark:hover:bg-red-950/50 text-slate-500 hover:text-red-600 rounded transition" title="Delete Page">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-6 py-8 md:px-16 lg:px-32" id="document-scroll-container">
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="space-y-3">
                        <div class="flex items-center gap-2">
                            <span id="page-emoji" class="text-4xl cursor-pointer hover:bg-slate-100 dark:hover:bg-zinc-800 p-1 rounded transition select-none" title="Change Emoji">📝</span>
                        </div>
                        <input type="text" id="page-title-input" name="title" placeholder="Untitled Page" class="w-full text-3xl md:text-4xl font-extrabold bg-transparent border-0 outline-none tracking-tight text-slate-900 dark:text-slate-100 placeholder-slate-300 dark:placeholder-zinc-600">
                    </div>

                    <!-- View Selectors -->
                    <div class="border-b border-slate-200 dark:border-zinc-800 flex items-center space-x-4 text-xs font-medium text-slate-500 pt-2" id="view-tabs">
                        <button class="px-2 py-1.5 border-b-2 border-sky-500 text-sky-600 dark:text-sky-400 flex items-center gap-1.5 active-tab" data-view="editor">
                            <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Page Content
                        </button>
                        <button class="px-2 py-1.5 border-b-2 border-transparent hover:text-slate-800 flex items-center gap-1.5" data-view="table">
                            <i data-lucide="table" class="w-3.5 h-3.5"></i> Table Database
                        </button>
                        <button class="px-2 py-1.5 border-b-2 border-transparent hover:text-slate-800 flex items-center gap-1.5" data-view="kanban">
                            <i data-lucide="kanban" class="w-3.5 h-3.5"></i> Kanban Board
                        </button>
                        <button class="px-2 py-1.5 border-b-2 border-transparent hover:text-slate-800 flex items-center gap-1.5" data-view="gallery">
                            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> Gallery View
                        </button>
                    </div>

                    <!-- Editor View -->
                    <div id="view-editor" class="view-panel space-y-2 pt-2">
                        <div id="blocks-container" class="space-y-2 min-h-[300px]"></div>
                        <div class="pt-4 border-t border-slate-100 dark:border-zinc-800/60 flex flex-wrap gap-2 text-xs">
                            <button class="add-block-btn flex items-center gap-1 px-2.5 py-1.5 rounded bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 transition" data-type="paragraph">
                                <i data-lucide="align-left" class="w-3.5 h-3.5 text-slate-500"></i> + Text
                            </button>
                            <button class="add-block-btn flex items-center gap-1 px-2.5 py-1.5 rounded bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 transition" data-type="h1">
                                <i data-lucide="heading-1" class="w-3.5 h-3.5 text-sky-500"></i> + Heading 1
                            </button>
                            <button class="add-block-btn flex items-center gap-1 px-2.5 py-1.5 rounded bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 transition" data-type="todo">
                                <i data-lucide="check-square" class="w-3.5 h-3.5 text-emerald-500"></i> + Task Checklist
                            </button>
                            <button class="add-block-btn flex items-center gap-1 px-2.5 py-1.5 rounded bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 transition" data-type="code">
                                <i data-lucide="code" class="w-3.5 h-3.5 text-amber-500"></i> + Code Block
                            </button>
                            <button class="add-block-btn flex items-center gap-1 px-2.5 py-1.5 rounded bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 transition" data-type="callout">
                                <i data-lucide="alert-circle" class="w-3.5 h-3.5 text-purple-500"></i> + Callout
                            </button>
                            <button type="button" class="add-block-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-zinc-800 hover:bg-sky-50 dark:hover:bg-zinc-700 text-slate-700 dark:text-slate-200 transition" data-type="image">
        <i data-lucide="image" class="w-3.5 h-3.5 text-emerald-500"></i> + Image
    </button>
    <button type="button" class="add-block-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-zinc-800 hover:bg-sky-50 dark:hover:bg-zinc-700 text-slate-700 dark:text-slate-200 transition" data-type="file">
        <i data-lucide="file-text" class="w-3.5 h-3.5 text-blue-500"></i> + File
    </button>
                        </div>
                    </div>

                    <!-- Table View -->
                    <div id="view-table" class="view-panel hidden space-y-4 pt-2">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-slate-500 font-medium">Database Items</span>
                                <button id="btn-export-csv" class="bg-slate-200 dark:bg-zinc-800 hover:bg-slate-300 text-xs px-2.5 py-1 rounded font-medium flex items-center gap-1">📊 Export CSV</button>
                                <button id="btn-import-csv" class="bg-slate-200 dark:bg-zinc-800 hover:bg-slate-300 text-xs px-2.5 py-1 rounded font-medium flex items-center gap-1">📥 Import CSV</button>
                                <input type="file" id="csv-file-input" class="hidden-input" accept=".csv">
                            </div>
                            <button id="add-db-row-btn" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded font-medium flex items-center gap-1">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Row
                            </button>
                        </div>
                        <div class="overflow-x-auto border border-slate-200 dark:border-zinc-800 rounded-lg">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead class="bg-slate-50 dark:bg-zinc-800/60 border-b border-slate-200 dark:border-zinc-800 text-slate-500">
                                    <tr>
                                        <th class="p-2.5 font-semibold">Item Title</th>
                                        <th class="p-2.5 font-semibold">Status</th>
                                        <th class="p-2.5 font-semibold">Tag</th>
                                        <th class="p-2.5 font-semibold">Priority</th>
                                        <th class="p-2.5 font-semibold text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="db-table-body" class="divide-y divide-slate-100 dark:divide-zinc-800"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Kanban View -->
                    <div id="view-kanban" class="view-panel hidden space-y-4 pt-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-500 font-medium">Task Workflow Board</span>
                            <button id="add-kanban-card-btn" class="bg-sky-600 text-white text-xs px-3 py-1.5 rounded font-medium flex items-center gap-1">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> New Card
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="kanban-columns-container"></div>
                    </div>

                    <!-- Gallery View -->
                    <div id="view-gallery" class="view-panel hidden space-y-4 pt-2">
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="gallery-cards-container"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-white dark:bg-zinc-900 p-6 rounded-lg w-80 space-y-4 shadow-xl border border-slate-200 dark:border-zinc-800">
            <h3 class="font-bold text-sm">Sign in to Supabase Sync</h3>
            <input type="email" id="auth-email" name="email" autocomplete="email" placeholder="Email address" class="w-full px-3 py-1.5 text-xs bg-slate-100 dark:bg-zinc-800 rounded border-0 outline-none">
            <input type="password" id="auth-password" name="password" autocomplete="current-password" placeholder="Password" class="w-full px-3 py-1.5 text-xs bg-slate-100 dark:bg-zinc-800 rounded border-0 outline-none">
            <div class="flex justify-end space-x-2 pt-2">
                <button id="auth-cancel" class="px-3 py-1 text-xs text-slate-500">Cancel</button>
                <button id="auth-submit" class="px-3 py-1 text-xs bg-sky-600 text-white rounded font-medium">Login / Register</button>
            </div>
        </div>
    </div>

    <!-- Load Main App Module -->
    <script type="module" src="./src/app.js"></script>

<!-- Modern Custom Confirm / Prompt Modal -->
<div id="custom-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center select-none">
    <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-6 w-96 space-y-4 shadow-2xl scale-95 opacity-0 transition-all duration-200" id="modal-box">
        <h3 id="modal-title" class="font-bold text-base text-slate-900 dark:text-slate-100">Are you sure?</h3>
        <p id="modal-desc" class="text-xs text-slate-500 dark:text-slate-400">This action cannot be undone.</p>
        <div id="modal-input-container" class="hidden pt-1">
            <input type="text" id="modal-input" name="modal_value" class="w-full px-3 py-2 text-xs bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-lg outline-none focus:ring-2 focus:ring-sky-500 text-slate-800 dark:text-slate-100">
        </div>
        <div class="flex justify-end space-x-2 pt-3">
            <button id="modal-cancel" class="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">Cancel</button>
            <button id="modal-confirm" class="px-4 py-2 text-xs font-medium bg-sky-600 hover:bg-sky-500 text-white rounded-lg shadow-sm transition">Confirm</button>
        </div>
    </div>
</div>

<!-- Add this lightbox modal right before the closing </body> tag in your index.html -->
<div id="image-lightbox-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer">
    <div class="relative max-w-5xl max-h-[90vh] overflow-auto">
        <button id="close-lightbox" class="absolute top-2 right-2 p-2 bg-black/60 hover:bg-black text-white rounded-full transition">✕</button>
        <img id="lightbox-img" src="" alt="Full Quality Image" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
    </div>
</div>

<!-- Add this emoji picker modal right before the closing </body> tag in your index.html -->
<div id="emoji-picker-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div id="emoji-modal-box" class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl shadow-2xl p-4 w-72 max-w-full scale-95 opacity-0 transition-all duration-150">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-zinc-800 mb-3">
            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 uppercase tracking-wider">Choose Page Emoji</span>
            <button id="close-emoji-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm font-bold px-1.5 py-0.5 rounded">✕</button>
        </div>
        <div class="grid grid-cols-5 gap-2 text-center">
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">📝</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">🚀</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">💡</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">📚</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">🎯</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">⚙️</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">📊</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">🔥</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">🎨</button>
            <button type="button" class="emoji-option p-2 text-xl hover:bg-slate-100 dark:hover:bg-zinc-800 rounded-lg transition">⭐</button>
        </div>
    </div>
</div>

</body>
</html>
